name: Build and Deploy Angular UI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Verify Node.js is available
        run: node --version

      - name: Verify npm is available
        run: npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration production

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: self-hosted
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v5

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration production

      - name: Copy web.config into build output
        shell: powershell
        run: |
          Copy-Item -Path "$env:GITHUB_WORKSPACE\web.config" `
                     -Destination "$env:GITHUB_WORKSPACE\dist\Concept-Tracking\browser\web.config" `
                     -Force

      - name: Check Angular build output
        shell: powershell
        run: |
          Get-ChildItem "$env:GITHUB_WORKSPACE\dist" -Recurse

      - name: Stop IIS app pool before file copy
        shell: powershell
        run: |
          Import-Module WebAdministration
          $appPool = "CONCEPT-TRACKING-UI-CICD"
          if ((Get-WebAppPoolState -Name $appPool).Value -eq "Started") {
              Stop-WebAppPool -Name $appPool
              Write-Host "App pool stopped"
              Start-Sleep -Seconds 5
          }
          else {
              Write-Host "App pool already stopped, continuing..."
          }

      - name: Copy Angular build to IIS folder
        shell: powershell
        run: |
          robocopy `
            "$env:GITHUB_WORKSPACE\dist\Concept-Tracking\browser" `
            "C:\apps\concept-tracking-CICD\ui" `
            /MIR
          if ($LASTEXITCODE -ge 8) {
            exit 1
          } else {
            exit 0
          }

      - name: Start IIS app pool
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-WebAppPool -Name "CONCEPT-TRACKING-UI-CICD"

      - name: Wait for app to become healthy
        shell: powershell
        run: |
          $maxAttempts = 30
          $attempt = 0
          $success = $false
          while ($attempt -lt $maxAttempts) {
            $attempt++
            try {
              $response = curl.exe -k -s -o NUL -w "%{http_code}" https://localhost:8400/
              if ($response -eq "200") {
                Write-Host "Application is healthy after $attempt attempts."
                $success = $true
                break
              }
            } catch {}
            Write-Host "Attempt $attempt/$maxAttempts - waiting 5 seconds..."
            Start-Sleep -Seconds 5
          }
          if (-not $success) {
            Write-Host "Application failed health check."
            exit 1
          }

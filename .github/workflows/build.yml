name: Build and Deploy Angular UI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify Node.js is available
        run: node --version
      - name: Verify npm is available
        run: npm --version
      - name: Verify git is available
        run: git --version

      - name: Install dependencies
        run: npm ci

      - name: Build Angular application
        run: npm run build -- --configuration production

      - name: Commit version bump
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: powershell
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            $pkgVersion = node -e "console.log(require('./package.json').version)"
            git commit -m "chore: bump version to $pkgVersion [skip ci]"
            git push origin HEAD:main
          } else {
            Write-Host "No version changes to commit"
          }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: angular-dist
          path: dist/Concept-Tracking/browser
          retention-days: 1
      <div class="avatar-img-wrapper">
        <img
          src="Images/avatar.png"
          alt="User"
          class="avatar-img"

            this.nextElementSibling.style.display = 'flex';

        <button

          (click)="togglePanel()"

            viewBox="0 0 24 24"

            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            [class.rotated]="panelCollapsed"
          >
            <polyline points="15 18 9 12 15 6" />
          </svg>
        </button>
